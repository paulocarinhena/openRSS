# openRSS — um único container. Na primeira visita, o assistente pergunta qual banco usar
# (SQLite ou PostgreSQL). Config, segredo e o banco SQLite ficam no volume "openrss-data".
#   docker compose up -d --build
services:
  openrss:
    build: .
    image: openrss:${OPENRSS_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "8285:3000"
    environment:
      # Opcional: se vazio, é gerado no primeiro boot e salvo em /data/config.json.
      APP_SECRET: ${APP_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8285}
      # Opcional: defina para pular o assistente (ex.: postgresql://user:pass@host:5432/openrss).
      DATABASE_URL: ${DATABASE_URL:-}
      ALLOW_PRIVATE_FEEDS: ${ALLOW_PRIVATE_FEEDS:-false}
      ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-false}
      DISABLE_SCHEDULER: ${DISABLE_SCHEDULER:-false}
    volumes:
      - openrss-data:/data

volumes:
  openrss-data:
