# openRSS com PostgreSQL embutido — para instâncias com mais usuários.
# DATABASE_URL já vem definida, então o assistente de instalação é pulado.
#   POSTGRES_PASSWORD=$(openssl rand -hex 32) docker compose -f docker-compose.postgres.yml up -d --build
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openrss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: openrss
    volumes:
      - openrss-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrss -d openrss"]
      interval: 5s
      timeout: 5s
      retries: 10

  openrss:
    build: .
    image: openrss:${OPENRSS_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8285:3000"
    environment:
      # Opcional: se vazio, é gerado no primeiro boot e salvo em /data/config.json.
      APP_SECRET: ${APP_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8285}
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://openrss:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/openrss
      ALLOW_PRIVATE_FEEDS: ${ALLOW_PRIVATE_FEEDS:-false}
      DISABLE_SCHEDULER: ${DISABLE_SCHEDULER:-false}
    volumes:
      # Guarda o APP_SECRET gerado (config.json) entre atualizações.
      - openrss-data:/data

volumes:
  openrss-pg:
  openrss-data:
