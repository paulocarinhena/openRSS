name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_SECRET: ci-only-random-secret-not-used-in-production
      DISABLE_SCHEDULER: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate database schemas and Prisma clients
        run: npm run db:generate
      - name: Verify generated schemas are current
        run: git diff --exit-code -- prisma/sqlite/schema.prisma prisma/postgres/schema.prisma
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
