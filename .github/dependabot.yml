version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # These packages share types. Separate bumps nest a second copy of `ai`
      # and break `tsc` on UIMessage.
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
    ignore:
      # typescript-eslint (via eslint-config-next) does not support TypeScript 7 yet.
      - dependency-name: "typescript"
        versions: [">=7"]
      # eslint-config-next still bundles eslint-plugin-import/jsx-a11y/react
      # whose peerDependencies cap at eslint@9.
      - dependency-name: "eslint"
        versions: [">=10"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
